[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-bridge"
version = "0.1.0"
description = "Unified streaming Feishu/Lark <-> Claude Code bridge (non-interactive print/pipe mode; no PTY/tmux)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "lark-oapi==1.7.1",
]

[project.scripts]
feishu-bridge = "bridge.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.hatch.build.targets.wheel.force-include]
"feishu_api.py" = "feishu_api.py"
