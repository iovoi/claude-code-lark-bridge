[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-channel"
version = "0.1.0"
description = "Feishu/Lark MCP channel for Claude Code (push inbound Feishu messages into a running session; reply/react tools)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "lark-oapi==1.7.1",
    "mcp==1.28.1",
]

[project.optional-dependencies]
windows = ["pywinpty>=2"]

[project.scripts]
feishu-channel = "mcp_channel.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["mcp_channel"]

[tool.hatch.build.targets.wheel.force-include]
"feishu_api.py" = "feishu_api.py"
